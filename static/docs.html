<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Federation Resolver API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
    <style>
        html, body { margin: 0; background: #fafafa; }
        .top { padding: 12px 20px; font: 13px/1.4 "Segoe UI", sans-serif; color: #333; border-bottom: 1px solid #e5e5e5; }
        .top a { color: #1f6fb2; }
    </style>
</head>
<body>
    <div class="top">OpenAPI explorer. Federation protocol routes are public. Use <strong>Authorize</strong> with <code>API_KEY</code> (operator) or <code>TA_API_TOKEN</code> (trust-anchor admin). Console: <a href="/">/</a>.</div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
        window.ui = SwaggerUIBundle({
            url: "/api/v1/openapi.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            tryItOutEnabled: true,
            persistAuthorization: true,
            displayRequestDuration: true,
        });
    </script>
</body>
</html>
